<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change password — Office</title>
<style>
:root{color-scheme:dark;--bg:#0b1116;--panel:#121b22;--line:#26343e;--muted:#9aabb6;--text:#e7eef2;--accent:#72e0b2;--red:#f08a83}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 80% 0%,#17332f 0,transparent 40%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}.panel{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 24px 80px #0006}.brand{color:var(--accent);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}.mark{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--accent);color:#10201a;font-size:18px;margin-right:9px}.brandline{display:flex;align-items:center}h1{font-size:23px;margin:22px 0 5px}p{color:var(--muted);margin:0 0 18px}.field{margin:15px 0}label{display:block;font-weight:650;margin-bottom:6px}input{width:100%;border:1px solid #394b55;border-radius:9px;background:#0c1318;color:var(--text);padding:11px;font:inherit}button{width:100%;margin-top:7px;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:700;background:var(--accent);color:#10201a;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.message{min-height:22px;color:var(--red);font-size:13px;margin-top:10px;overflow-wrap:anywhere}.message.ok{color:var(--accent)}
</style>
</head>
<body><main class="panel"><div class="brandline"><span class="mark">O</span><span class="brand">Hermes workspace</span></div><h1>Change your password</h1><p>This first-login change is required before Office can be used. Choose at least 8 characters.</p><form id="change"><div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required></div><button id="submit">Save new password</button><div class="message" id="message" role="status" aria-live="polite"></div></form></main>
<script>
const form=document.querySelector('#change'),password=document.querySelector('#password'),confirm=document.querySelector('#confirm'),message=document.querySelector('#message'),button=document.querySelector('#submit');form.addEventListener('submit',async event=>{event.preventDefault();message.classList.remove('ok');message.textContent='';if(password.value!==confirm.value){message.textContent='The passwords do not match.';return}button.disabled=true;try{const response=await fetch('/api/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Password change failed.');form.reset();message.classList.add('ok');message.textContent='Password changed. Sign in again with your new password.';setTimeout(()=>location.reload(),1200)}catch(error){message.textContent=error.message;button.disabled=false}});
</script></body></html>
