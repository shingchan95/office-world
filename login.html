<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Office</title>
<style>
:root{color-scheme:dark;--bg:#0b1116;--panel:#121b22;--line:#26343e;--muted:#9aabb6;--text:#e7eef2;--accent:#72e0b2;--warn:#efc674;--red:#f08a83}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 80% 0%,#17332f 0,transparent 40%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}.panel{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 24px 80px #0006}.brand{color:var(--accent);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}.mark{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--accent);color:#10201a;font-size:18px;margin-right:9px}.brandline{display:flex;align-items:center}h1{font-size:23px;margin:22px 0 5px}p{color:var(--muted);margin:0 0 18px}.warning{border:1px solid #554c32;background:#2a2619;color:#e8d6a6;border-radius:10px;padding:11px 12px;font-size:12px;margin:18px 0}.field{margin:15px 0}label{display:block;font-weight:650;margin-bottom:6px}input{width:100%;border:1px solid #394b55;border-radius:9px;background:#0c1318;color:var(--text);padding:11px;font:inherit}button{width:100%;margin-top:7px;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:700;background:var(--accent);color:#10201a;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.message{min-height:22px;color:var(--red);font-size:13px;margin-top:10px;overflow-wrap:anywhere}
</style>
</head>
<body><main class="panel"><div class="brandline"><span class="mark">O</span><span class="brand">Hermes workspace</span></div><h1>Sign in to Office</h1><p>Use your Office account to continue.</p><div class="warning"><strong>HTTP notice:</strong> this private-LAN connection is not encrypted. Do not sign in on guest or untrusted Wi-Fi, and do not forward port 8443 to the internet.</div><form id="login"><div class="field"><label for="username">Username</label><input id="username" name="username" value="tommy" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button id="submit">Sign in</button><div class="message" id="message" role="status" aria-live="polite"></div></form></main>
<script>
const form=document.querySelector('#login'),message=document.querySelector('#message'),button=document.querySelector('#submit');form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;message.textContent='';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value,password:form.password.value})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Sign-in failed.');location.reload()}catch(error){message.textContent=error.message;button.disabled=false}});
</script></body></html>
